# Fairness Benchmark Configuration
# Dual-client concurrent execution: random-read victim vs sequential-scan neighbor
#
# Both clients run simultaneously to demonstrate pagecache fairness issues.
#
# client1 (victim)   : RANDOM read, steady, rate-limited. Random reads depend on
#                      cache residency (readahead can't hide a random miss), so
#                      eviction by client2 directly inflates client1's p99.
#                      Phase 0 does ONE sequential warmup pass first to prime the
#                      cache, then random reads; phases 1 & 2 are pure random read
#                      at the SAME speed, repeating over the file for the runtime.
# client2 (neighbor) : SEQUENTIAL read scan over an 8G file. Slow trickle in
#                      phases 0 & 2; in phase 1 it cranks up jobs + iodepth
#                      (unthrottled) to evict client1's pages within the first
#                      half of the phase, then keeps re-reading the 8G file until
#                      the phase ends.
#
# All phases run for 60s (driven by client1's phase runtime; see run script).
#
# Note: rate_iops limits the IOPS PER JOB. With numjobs=8 and rate_iops=1000,
#       total IOPS will be 8 * 1000 = 8000 IOPS max. Omit rate_iops for no cap.

[client1_steady]
description = Victim client - Random reader, 256M file, rate limit 50K IOPS, 4k block size
file_size = 256M
# Phase 0: ONE full sequential read of the file (warmup, primes page cache),
#          then steady random reads for the rest of the phase (neighbor quiet).
phase_0_warmup = sequential
phase_0_numjobs = 1
phase_0_runtime = 60
phase_0_pattern = randread
phase_0_block_size = 4k
phase_0_rate_iops = 50000
phase_0_iodepth = 8
phase_0_ioengine = libaio
# Phase 1: same random read at the SAME speed as phase 0, repeating over the file
#          for the whole phase (neighbor BURSTS -> expect p99 spike here).
phase_1_numjobs = 1
phase_1_runtime = 60
phase_1_pattern = randread
phase_1_block_size = 4k
phase_1_rate_iops = 50000
phase_1_iodepth = 8
phase_1_ioengine = libaio
# Phase 2: same random read at the SAME speed (neighbor quiet again -> recovery).
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_pattern = randread
phase_2_block_size = 4k
phase_2_rate_iops = 50000
phase_2_iodepth = 8
phase_2_ioengine = libaio

[client2_bursty]
description = Neighbor client - Sequential scan over 8G file; slow -> heavy burst -> slow
file_size = 8G
# Phase 0: slow sequential trickle (rate-limited) for the whole phase.
phase_0_numjobs = 1
phase_0_runtime = 60
phase_0_pattern = read
phase_0_block_size = 4k
phase_0_rate_iops = 1024
phase_0_iodepth = 8
phase_0_ioengine = libaio
# Phase 1: HEAVY sequential burst -- crank up BOTH numjobs and iodepth, NO rate
#          cap, so it evicts all of client1's cached pages well within the first
#          half of the phase, then keeps re-reading the 8G file until the phase
#          ends (--time_based loops back to the start at EOF).
#          16 jobs x iodepth 64 = 1024 outstanding reads flooding the page cache.
phase_1_numjobs = 16
phase_1_runtime = 60
phase_1_pattern = read
phase_1_block_size = 4k
phase_1_iodepth = 64
phase_1_ioengine = libaio
# Phase 2: throttle back down to the phase-0 slow trickle (recovery).
phase_2_numjobs = 1
phase_2_runtime = 60
phase_2_pattern = read
phase_2_block_size = 4k
phase_2_rate_iops = 1024
phase_2_iodepth = 8
phase_2_ioengine = libaio